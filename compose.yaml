services:
  vstworld:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - source-data:/data
    environment:
      VSTWORLD_ALLOWED_HOSTS: "${VSTWORLD_ALLOWED_HOSTS:-}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
  ollama:
    image: ollama/ollama:latest
    profiles: [ai]
    network_mode: service:vstworld
    environment:
      OLLAMA_HOST: "127.0.0.1:11434"
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - model-data:/root/.ollama
    restart: unless-stopped
  libretranslate:
    image: libretranslate/libretranslate:latest
    profiles: [translate]
    network_mode: service:vstworld
    environment:
      LT_HOST: "127.0.0.1"
      LT_PORT: "5000"
      LT_LOAD_ONLY: "ru,en,pt,es"
    volumes:
      - translation-data:/home/libretranslate/.local
    restart: unless-stopped
volumes:
  source-data:
  model-data:
  translation-data:
